# Pings the backend every 10 minutes so Render's free server never falls asleep.
# A sleeping server takes 30-60s to wake, which is when visitors and search
# engines see "Failed to fetch". One always-on service fits inside Render's
# free 750 hours a month.
#
# Note: GitHub pauses scheduled workflows after 60 days without commits to the
# repository. If that happens, re-enable it from the repository's Actions tab.

name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        run: |
          curl --silent --show-error --fail --max-time 90 --retry 2 --retry-delay 10 \
            https://koza-2fkh.onrender.com/api/health
